name: Actualizacion Automatica de Mercado (Donde Invierto)

on:
  schedule:
    # Cada 1 hora durante rueda de mercado (Lunes a Viernes de 10:00 a 18:00 hs de Buenos Aires / 13:00 a 21:00 UTC)
    # Cubre el horario de verano actual (apertura 10:30 hs) y el cambio de horario de invierno (apertura 11:30 hs y cierre 18:00 hs)
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch: # Permite ejecutar la actualización manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de actualización de mercado
        run: node scripts/update_market.js

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data/marketData.json
          if git diff --staged --quiet; then
            echo "Sin variaciones de precio para commitear."
          else
            git commit -m "chore(data): auto-update market quotes [skip ci]"
            git push
          fi
