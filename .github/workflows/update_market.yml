name: Actualizacion Automatica de Mercado (Donde Invierto)

on:
  schedule:
    # 1. Barrido Pre-Market a las 6:00 AM (09:00 UTC)
    # 2. Barrido cada 1 hora durante rueda de mercado: 10:00 a 18:00 hs de Buenos Aires (13:00 a 21:00 UTC)
    # 3. Barrido Post-Market 1 hora después del cierre: 19:00 hs de Buenos Aires (22:00 UTC)
    - cron: '0 9,13-22 * * 1-5'
  workflow_dispatch: # Permite ejecutar la actualización manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de actualización de mercado
        run: node scripts/update_market.js

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data/marketData.json
          if git diff --staged --quiet; then
            echo "Sin variaciones de precio para commitear."
          else
            git commit -m "chore(data): auto-update market quotes"
            git push
          fi
