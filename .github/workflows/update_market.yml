name: Actualización Automática de Mercado (Donde Invierto)

on:
  schedule:
    # Rueda bursátil activa (Lunes a Viernes): Cada 1 hora entre las 10:15 y las 18:15 hs ART (13:15 a 21:15 UTC)
    - cron: '15 13-21 * * 1-5'
    # Cierre definitivo y Post-Market: 19:30 hs ART (22:30 UTC) - Lunes a Viernes
    - cron: '30 22 * * 1-5'
    # Sincronización de Fin de Semana: Sábados y Domingos 13:00 hs ART (16:00 UTC)
    - cron: '0 16 * * 0,6'
    # Previa de Apertura Semanal: Domingos 21:30 hs ART (00:30 UTC del Lunes)
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo de la actualización manual'
        required: false
        default: 'Refresco manual de mercado'

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: true

jobs:
  update-market-data:
    name: Ingesta, Valuación Cuantitativa y Sincronización
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Ejecutar motor de actualización cuantitativa de mercado
        run: node scripts/update_market.js

      - name: Verificar integridad de datos generados
        run: |
          node -e "
            const data = require('./web/src/data/marketData.json');
            if (!data.stocks || data.stocks.length < 50) {
              console.error('ERROR: Archivo marketData.json incompleto o corrupto');
              process.exit(1);
            }
            console.log('Validación exitosa: ' + data.stocks.length + ' acciones auditadas, CCL: $' + data.ccl_dollar);
          "

      - name: Guardar y subir cambios a producción (Vercel Deploy)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data/marketData.json
          if git diff --staged --quiet; then
            echo "Sin variaciones de precio en esta rueda para commitear."
          else
            git commit -m "chore(data): auto-update market quotes & quantitative scores"
            git push origin main
          fi
