name: Actualizacion Automatica de Mercado (Donde Invierto)

on:
  schedule:
    # Horarios de Lunes a Viernes (Hora de Buenos Aires UTC-3):
    # 14:30 UTC -> 11:30 ART (Apertura de rueda)
    - cron: '30 14 * * 1-5'
    # 17:30 UTC -> 14:30 ART (Mitad de rueda)
    - cron: '30 17 * * 1-5'
    # 20:15 UTC -> 17:15 ART (Cierre de rueda)
    - cron: '15 20 * * 1-5'
  workflow_dispatch: # Permite ejecutar la actualización manualmente desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de actualización de mercado
        run: node scripts/update_market.js

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/data/marketData.json
          if git diff --staged --quiet; then
            echo "Sin variaciones de precio para commitear."
          else
            git commit -m "chore(data): auto-update market quotes [skip ci]"
            git push
          fi
