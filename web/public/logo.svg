<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="auto" role="img" aria-label="donde invierto logo">
  <defs>
    <!-- Gradientes para las barras -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E024C3" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#BA68C8" />
    </linearGradient>

    <!-- Gradiente para el signo de interrogación -->
    <linearGradient id="qMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E35B1" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>

    <!-- Gradiente para la flecha destacada -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
  </defs>

  <!-- Isotipo: Barras estadísticas, Signo y Flecha -->
  <g id="icon" transform="translate(10, 10)">
    <!-- Barra 1 (Izquierda) -->
    <rect x="20" y="85" width="28" height="95" rx="3" fill="url(#bar1Grad)" />

    <!-- Barra 2 (Centro) -->
    <rect x="56" y="55" width="28" height="125" rx="3" fill="url(#bar2Grad)" />

    <!-- Barra 3 (Derecha) -->
    <rect x="92" y="25" width="28" height="155" rx="3" fill="url(#bar3Grad)" />

    <!-- Signo de Interrogación (?) -->
    <path d="M 130 52 C 130 20 185 20 185 52 C 185 75 155 85 155 110" 
          fill="none" 
          stroke="url(#qMarkGrad)" 
          stroke-width="18" 
          stroke-linecap="round" />
    <circle cx="155" cy="140" r="10" fill="url(#qMarkGrad)" />

    <!-- Flecha ascendente quebrada en relieve -->
    <!-- Borde de contraste / sombra -->
    <polyline points="5 155, 32 120, 68 152, 160 50" 
              fill="none" 
              stroke="#FFFFFF" 
              stroke-width="20" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
    <!-- Trazo principal -->
    <polyline points="5 155, 32 120, 68 152, 160 50" 
              fill="none" 
              stroke="url(#arrowGrad)" 
              stroke-width="14" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
    <!-- Punta de flecha -->
    <path d="M 140 46 L 165 45 L 164 70 Z" 
          fill="url(#arrowGrad)" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linejoin="round" />
  </g>

  <!-- Tipografía (donde invierto) -->
  <g id="text-group">
    <!-- "donde" -->
    <text x="235" y="92" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="78" 
          fill="#231F75" 
          letter-spacing="-1.5">donde</text>

    <!-- "invierto" -->
    <text x="235" y="168" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" 
          font-size="78" 
          fill="#00BFA5" 
          letter-spacing="-1.5">invierto</text>
  </g>
</svg>
